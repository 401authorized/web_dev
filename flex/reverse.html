<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            justify-content: space-evenly;
            height: 300px;
            width: 400px;
            padding: 10px 10px ;
            border: 2px solid #ccc;
            flex-direction: column-reverse;
        }

        .box {
            width: 50px;
            height: 50px;
            background-color: rgb(10, 31, 52);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            top: 10%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">A</div>
        <div class="box">B</div>
        <div class="box">C</div>
    </div>
</body>
</html>
