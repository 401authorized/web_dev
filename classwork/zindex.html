<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zindex</title>

<style>
    img{
        position: absolute;
        top: 0px;
        left: 0px;
        z-index:-1;
        width: 200px;
        height: 200px;
    }
</style>
</head>
<body>
    <h1> This is heading</h1>
    <img src="graphictree.jpg" alt="tree">
    <p> tree behind paragraph</p>

</body>
</html>
