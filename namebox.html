<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .div1 {
            width: 200px;
            height: 200px;
            background-color: rgb(10, 31, 52);
            position: relative;
            border-radius: 5%;
            text-align: right;
            text-overflow: ellipsis;
            color: white;
            margin: 10px;
        }

        .d1 {
            position: absolute;
            left: 50%;
            top: 0%;
            text-align: center;
        }

        .d2 {
            position: absolute;
            bottom: 50%;
            right: 0%;
            text-align: center;
        }

        .d3 {
            position: absolute;
            left: 100%;
            bottom: 50%;
            text-align: center;
        }

        .d4 {
            position: absolute;
            bottom: 0%;
            right: 50%;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="div1">

        <div class="d1">AANYA</div>
        <div class="d2">AANYA</div>
        <div class="d3">AANYA</div>
        <div class="d4">AANYA</div>

    </div>

</body>

</html>
