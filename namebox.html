<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .div1 {
            width: 200px;
            height: 200px;
            background-color: rgb(10, 31, 52);
            position: relative;
            border-radius: 5%;
            text-align: right;
            text-overflow: ellipsis;
            color:white;
            margin: 10px;
        }

        .d1 {
            position: absolute;
        }
         .d2 {
            position: absolute;
            bottom: 0%;
        }
         .d3 {
            position: absolute;
            right: 0%;
        }
         .d4 {
            position: absolute;
            bottom: 0%;
            right: 0%;
        }

    </style>
</head>

<body>
    <div class="div1">

        <div class="d1">AANYA</div>
        <div class="d2">AANYA</div>
        <div class="d3">AANYA</div>
        <div class="d4">AANYA</div>

    </div>

</body>

</html>
