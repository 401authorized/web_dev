<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: grid;
            width: 600px;
            height: 600px;
            grid-template-columns: repeat(2, 2fr);
            gap: 10px;
            border: 2px solid #ccc;
            grid-gap: 0.5em;
            align-items: center;
            align-content: space-around;
            justify-items: center;
        }

        .box {
            width: 200px;
            height: 100px;
            background-color: rgb(10, 31, 52);
            color: white;
            text-align: center;
            padding: 20px;
            border-radius: 5%;
            
            justify-content: center;
    
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
    </div>
</body>

</html>
